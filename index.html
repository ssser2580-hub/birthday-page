<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Dr. Ezwan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:Arial,sans-serif;background:#111}
.card{width:90%;max-width:700px;height:550px;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,#ffd0da,#f3a2b5 60%,#e889a3);border-radius:45px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.heart{position:absolute;color:white;font-size:25px;opacity:0;animation:floatHeart 6s linear infinite}
.heart:nth-child(1){left:10%;animation-delay:0s}.heart:nth-child(2){left:25%;animation-delay:2s}.heart:nth-child(3){left:45%;animation-delay:1s}.heart:nth-child(4){left:65%;animation-delay:3s}.heart:nth-child(5){left:82%;animation-delay:1.5s}
@keyframes floatHeart{0%{top:100%;opacity:0;transform:scale(.5) rotate(0deg)}20%{opacity:1}80%{opacity:.8}100%{top:-50px;opacity:0;transform:scale(1.2) rotate(360deg)}}
.confetti{position:absolute;width:8px;height:15px;background:white;opacity:.7;animation:confettiFall 5s linear infinite}
.confetti:nth-child(7){left:15%;animation-delay:0s}.confetti:nth-child(8){left:35%;animation-delay:1s}.confetti:nth-child(9){left:55%;animation-delay:2s}.confetti:nth-child(10){left:75%;animation-delay:1s}.confetti:nth-child(11){left:90%;animation-delay:3s}
@keyframes confettiFall{0%{top:-30px;transform:rotate(0deg)}100%{top:600px;transform:rotate(720deg)}}
.cake{position:absolute;width:220px;height:190px;top:220px}
.layer{position:absolute;left:50%;transform:translateX(-50%) translateY(50px);height:42px;border-radius:8px;opacity:0;animation:cakeLayer 1s forwards}
.layer1{width:210px;bottom:0;background:linear-gradient(#a66c5d,#805046);animation-delay:.8s}
.layer2{width:170px;bottom:40px;background:linear-gradient(#c18472,#986051);animation-delay:1.8s}
.layer3{width:130px;bottom:80px;background:linear-gradient(#d99a88,#ad6c5b);animation-delay:2.8s}
@keyframes cakeLayer{0%{opacity:0;transform:translateX(-50%) translateY(50px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
.cream{position:absolute;height:13px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff7ed;border-radius:10px;z-index:5;opacity:0;animation:creamShow 1s forwards}
.cream1{width:185px;bottom:34px;animation-delay:2s}.cream2{width:145px;bottom:74px;animation-delay:3s}.cream3{width:105px;bottom:114px;animation-delay:4s}
@keyframes creamShow{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.candle{position:absolute;width:13px;height:60px;left:50%;bottom:120px;transform:translateX(-50%) scaleY(0);transform-origin:bottom;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f2a0b5 6px,#f2a0b5 10px);border-radius:3px;z-index:10;animation:candleShow 1s forwards;animation-delay:4.5s}
@keyframes candleShow{to{transform:translateX(-50%) scaleY(1)}}
.flame{position:absolute;width:18px;height:25px;left:-2px;top:-24px;background:#ffae00;border-radius:50% 50% 50% 0;transform:rotate(45deg) scale(.5);opacity:0;animation:fire .7s infinite alternate;animation-delay:5.5s}
@keyframes fire{0%{opacity:.5;transform:rotate(45deg) scale(.7)}100%{opacity:1;transform:rotate(45deg) scale(1.1);box-shadow:0 0 20px orange,0 0 40px #ffd000}}
.title{position:absolute;top:55px;width:100%;text-align:center;color:#a82d59;font-size:38px;font-weight:bold;line-height:1.3;opacity:0;transform:translateY(-25px);animation:titleShow 2s forwards;animation-delay:5.8s;text-shadow:2px 3px 5px rgba(255,255,255,.7)}
.title span{display:block;font-size:30px;margin-top:8px}
@keyframes titleShow{to{opacity:1;transform:translateY(0)}}
.replay{position:absolute;bottom:20px;padding:10px 22px;border:none;border-radius:25px;background:#a82d59;color:white;font-size:14px;cursor:pointer;z-index:20;transition:.3s}
.replay:hover{transform:scale(1.08)}
@media(max-width:600px){.card{width:95%;height:90vh;border-radius:30px}.title{top:50px;font-size:30px}.title span{font-size:24px}.cake{top:250px;transform:scale(.85)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">💙</div><div class="heart">✨</div><div class="heart">💙</div><div class="heart">🌍</div><div class="heart">✨</div>
<div class="confetti"></div><div class="confetti"></div><div class="confetti"></div><div class="confetti"></div><div class="confetti"></div>
<div class="title">Happy birthday,<span>Dr. Ezwan 💙🌍✨</span></div>
<div class="cake">
<div class="layer layer1"></div><div class="layer layer2"></div><div class="layer layer3"></div>
<div class="cream cream1"></div><div class="cream cream2"></div><div class="cream cream3"></div>
<div class="candle"><div class="flame"></div></div>
</div>
<button class="replay" onclick="location.reload()">Replay 🔄</button>
</div>
</body>
</html>
